<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - SportsReplayed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "Event Details - SportsReplayed",
      "url": "https://sportsreplayed.com/event.html",
      "description": "Deep-dive event page on SportsReplayed where fans can review, rate, and discuss a single sports match.",
      "keywords": [
        "review NBA games replay platform",
        "write reviews of sports matches online",
        "review controversial football moments",
        "breakdown of VAR decisions online",
        "review key hockey replay moments",
        "analyze referee decisions using replays"
      ]
    }
    </script>
    <script src="js/config.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .event-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .event-loading { text-align: center; padding: 60px 0; color: var(--text-color); }
        .event-error { text-align: center; padding: 60px 0; color: #ff6b6b; }
        
        .event-header { 
            display: flex; 
            gap: 30px; 
            margin-bottom: 40px;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
        }
        
        .event-poster { 
            flex: 0 0 300px;
            background: var(--bg-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
        }
        
        .event-poster i { 
            font-size: 4rem; 
            color: var(--accent-color);
            opacity: 0.7;
        }
        
        .event-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .event-info { flex: 1; }
        .event-info h1 { 
            border: none; 
            margin-bottom: 15px;
            font-size: 2.5rem;
        }
        
        .event-meta { 
            color: var(--text-color);
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        
        .event-teams {
            display: flex;
            align-items: center;
            gap: 20px;
            margin: 30px 0;
            padding: 20px;
            background: var(--bg-color);
            border-radius: 8px;
        }
        
        .team { 
            flex: 1; 
            text-align: center;
        }
        
        .team-logo { 
            width: 80px; 
            height: 80px;
            margin: 0 auto 10px;
            background: var(--card-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .team-logo img { 
            max-width: 60px; 
            max-height: 60px;
        }
        
        .vs { 
            font-weight: bold; 
            color: var(--accent-color);
            font-size: 1.2rem;
        }
        
        .event-actions {
            display: flex;
            gap: 15px;
            margin: 25px 0;
        }
        
        .btn { 
            padding: 12px 24px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn.secondary { 
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
        }
        
        .btn.active { 
            background: #2a7c2a;
        }
        
        .event-details {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
            margin-top: 40px;
        }
        
        .reviews-section {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }
        
        .event-sidebar {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
        }
        
        .detail-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .detail-label {
            font-weight: 600;
            color: var(--text-light);
            margin-bottom: 5px;
        }
        
        .detail-value {
            color: var(--text-color);
        }
        
        .similar-events {
            margin-top: 40px;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .event-card {
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s ease;
        }
        
        .event-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>

<body>
    <div data-include="header"></div>

    <main>
        <div class="event-container">
            <!-- Loading State -->
            <div id="event-loading" class="event-loading">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>Loading event details...</p>
            </div>

            <!-- Error State -->
            <div id="event-error" class="event-error" style="display: none;">
                <i class="fas fa-exclamation-triangle fa-2x"></i>
                <h2>Event Not Found</h2>
                <p>We couldn't find the event you're looking for.</p>
                <a href="games.html" class="btn">Browse All Sports</a>
            </div>

            <!-- Event Content (Dynamically Loaded) -->
            <div id="event-content" style="display: none;">
                <!-- Header with poster and basic info -->
                <div class="event-header">
                    <div class="event-poster" id="event-poster">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="event-info">
                        <h1 id="event-title">Event Title</h1>
                        <div class="event-meta" id="event-meta"></div>
                        
                        <!-- Teams/Players -->
                        <div class="event-teams" id="event-teams">
                            <!-- Dynamically populated -->
                        </div>
                        
                        <!-- User Actions -->
                        <div class="event-actions">
                            <button class="btn" id="watchlist-btn">
                                <i class="fas fa-plus"></i> Watchlist
                            </button>
                            <button class="btn secondary" id="watched-btn">
                                <i class="fas fa-check"></i> Mark Watched
                            </button>
                            <button class="btn secondary" id="review-btn">
                                <i class="fas fa-edit"></i> Write Review
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Main content area -->
                <div class="event-details">
                    <!-- Reviews Section -->
                    <div class="reviews-section">
                        <h2>Reviews</h2>
                        <div id="event-reviews">
                            <p>No reviews yet. Be the first to review this event!</p>
                        </div>
                        
                        <!-- Review Form (shown when user clicks Write Review) -->
                        <div id="review-form" style="display: none; margin-top: 20px;">
                            <div class="form-row">
                                <label>Your Rating</label>
                                <div class="stars" id="review-stars">
                                    <i class="fa-solid fa-star star" data-value="1"></i>
                                    <i class="fa-solid fa-star star" data-value="2"></i>
                                    <i class="fa-solid fa-star star" data-value="3"></i>
                                    <i class="fa-solid fa-star star" data-value="4"></i>
                                    <i class="fa-solid fa-star star" data-value="5"></i>
                                </div>
                            </div>
                            <div class="form-row">
                                <textarea id="review-text" placeholder="Share your thoughts about this event..." style="width: 100%; min-height: 120px;"></textarea>
                            </div>
                            <div class="form-actions">
                                <button class="btn" id="submit-review">Submit Review</button>
                                <button class="btn secondary" id="cancel-review">Cancel</button>
                            </div>
                        </div>
                    </div>

                    <!-- Sidebar with event details -->
                    <div class="event-sidebar">
                        <h3>Event Details</h3>
                        <div id="event-details-list">
                            <!-- Dynamically populated -->
                        </div>
                        
                        <div style="margin-top: 30px;">
                            <h3>Quick Actions</h3>
                            <button class="btn secondary" style="width: 100%; margin-bottom: 10px;">
                                <i class="fas fa-share"></i> Share Event
                            </button>
                            <button class="btn secondary" style="width: 100%;">
                                <i class="fas fa-flag"></i> Report Issue
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Similar Events -->
                <div class="similar-events">
                    <h2>Similar Events</h2>
                    <div class="events-grid" id="similar-events">
                        <!-- Dynamically populated -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    
    <div data-include="footer"></div>

    <script>
        class EventPage {
            constructor() {
                this.eventId = this.getEventIdFromURL();
                this.eventData = null;
                this.userRating = 0;
                
                this.init();
            }

            getEventIdFromURL() {
                const urlParams = new URLSearchParams(window.location.search);
                return urlParams.get('id');
            }

            async init() {
                if (!this.eventId) {
                    this.showError();
                    return;
                }

                await this.loadEventData();
                this.setupEventHandlers();
            }

            async loadEventData() {
                try {
                    // Using The Sports DB API - Event lookup
                    const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/lookupevent.php?id=${this.eventId}`);
                    
                    if (!response.ok) {
                        throw new Error('API request failed');
                    }

                    const data = await response.json();
                    
                    if (!data.events || data.events.length === 0) {
                        throw new Error('Event not found');
                    }

                    this.eventData = data.events[0];
                    this.displayEventData();
                    this.hideLoading();
                    
                    // Load similar events
                    await this.loadSimilarEvents();

                } catch (error) {
                    console.error('Error loading event:', error);
                    this.showError();
                }
            }

            displayEventData() {
                // Basic info
                document.getElementById('event-title').textContent = this.eventData.strEvent;
                document.title = `${this.eventData.strEvent} - SportsReplayed`;

                // Meta information
                const metaEl = document.getElementById('event-meta');
                const date = new Date(this.eventData.dateEvent + 'T' + (this.eventData.strTime || '00:00:00'));
                metaEl.innerHTML = `
                    <div><i class="fas fa-calendar"></i> ${date.toLocaleDateString()}</div>
                    <div><i class="fas fa-clock"></i> ${this.eventData.strTime || 'Time TBD'}</div>
                    <div><i class="fas fa-trophy"></i> ${this.eventData.strLeague || 'Unknown League'}</div>
                    <div><i class="fas fa-map-marker-alt"></i> ${this.eventData.strVenue || 'Venue TBD'}</div>
                `;

                // Teams
                const teamsEl = document.getElementById('event-teams');
                if (this.eventData.strHomeTeam && this.eventData.strAwayTeam) {
                    teamsEl.innerHTML = `
                        <div class="team">
                            <div class="team-logo">
                                ${this.eventData.strHomeTeamBadge ? 
                                    `<img src="${this.eventData.strHomeTeamBadge}" alt="${this.eventData.strHomeTeam}">` : 
                                    `<i class="fas fa-users"></i>`
                                }
                            </div>
                            <div class="team-name">${this.eventData.strHomeTeam}</div>
                            ${this.eventData.intHomeScore ? `<div class="score">${this.eventData.intHomeScore}</div>` : ''}
                        </div>
                        <div class="vs">VS</div>
                        <div class="team">
                            <div class="team-logo">
                                ${this.eventData.strAwayTeamBadge ? 
                                    `<img src="${this.eventData.strAwayTeamBadge}" alt="${this.eventData.strAwayTeam}">` : 
                                    `<i class="fas fa-users"></i>`
                                }
                            </div>
                            <div class="team-name">${this.eventData.strAwayTeam}</div>
                            ${this.eventData.intAwayScore ? `<div class="score">${this.eventData.intAwayScore}</div>` : ''}
                        </div>
                    `;
                }

                // Poster/Thumbnail
                const posterEl = document.getElementById('event-poster');
                if (this.eventData.strThumb) {
                    posterEl.innerHTML = `<img src="${this.eventData.strThumb}" alt="${this.eventData.strEvent}">`;
                }

                // Event details
                const detailsEl = document.getElementById('event-details-list');
                detailsEl.innerHTML = `
                    <div class="detail-item">
                        <div class="detail-label">Sport</div>
                        <div class="detail-value">${this.eventData.strSport || 'Not specified'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">League</div>
                        <div class="detail-value">${this.eventData.strLeague || 'Not specified'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Season</div>
                        <div class="detail-value">${this.eventData.strSeason || 'Not specified'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Venue</div>
                        <div class="detail-value">${this.eventData.strVenue || 'Not specified'}</div>
                    </div>
                    ${this.eventData.strDescription ? `
                    <div class="detail-item">
                        <div class="detail-label">Description</div>
                        <div class="detail-value">${this.eventData.strDescription}</div>
                    </div>
                    ` : ''}
                `;

                // Load reviews for this event
                this.loadEventReviews();
            }

            async loadSimilarEvents() {
                try {
                    // Get events from same league/season
                    const leagueId = this.eventData.idLeague;
                    const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsseason.php?id=${leagueId}&s=${this.eventData.strSeason}`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        this.displaySimilarEvents(data.events || []);
                    }
                } catch (error) {
                    console.error('Error loading similar events:', error);
                }
            }

            displaySimilarEvents(events) {
                const container = document.getElementById('similar-events');
                if (!events || events.length === 0) {
                    container.innerHTML = '<p>No similar events found.</p>';
                    return;
                }

                // Filter out current event and limit to 6
                const similarEvents = events
                    .filter(event => event.idEvent !== this.eventId)
                    .slice(0, 6);

                container.innerHTML = similarEvents.map(event => `
                    <div class="event-card" onclick="window.location.href='event.html?id=${event.idEvent}'">
                        <div style="text-align: center; margin-bottom: 10px;">
                            ${event.strThumb ? 
                                `<img src="${event.strThumb}" alt="${event.strEvent}" style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px;">` :
                                `<i class="fas fa-trophy" style="font-size: 2rem; color: var(--accent-color);"></i>`
                            }
                        </div>
                        <h4 style="margin: 0 0 8px 0; font-size: 0.9rem;">${event.strEvent}</h4>
                        <p style="margin: 0; font-size: 0.8rem; color: var(--text-color);">
                            ${new Date(event.dateEvent).toLocaleDateString()}
                        </p>
                    </div>
                `).join('');
            }

            async loadEventReviews() {
                // Use your existing reviews API
                try {
                    const auth = window.Auth?.getAuth?.() || { token: null };
                    const response = await fetch(`${window.reviewsApiUrl}?eventId=${this.eventId}`, {
                        headers: auth.token ? { 'Authorization': 'Bearer ' + auth.token } : {}
                    });

                    if (response.ok) {
                        const reviews = await response.json();
                        this.displayReviews(reviews);
                    }
                } catch (error) {
                    console.error('Error loading reviews:', error);
                }
            }

            displayReviews(reviews) {
                const container = document.getElementById('event-reviews');
                
                if (!reviews || reviews.length === 0) {
                    container.innerHTML = '<p>No reviews yet. Be the first to review this event!</p>';
                    return;
                }

                container.innerHTML = reviews.map(review => `
                    <div class="review-item" style="padding: 15px; border-bottom: 1px solid var(--border-color);">
                        <div style="display: flex; justify-content: between; align-items: center; margin-bottom: 10px;">
                            <strong>@${review.username}</strong>
                            <div>${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}</div>
                        </div>
                        <p style="margin: 0;">${review.text}</p>
                    </div>
                `).join('');
            }

            setupEventHandlers() {
                // Watchlist button
                document.getElementById('watchlist-btn').addEventListener('click', () => {
                    this.addToWatchlist();
                });

                // Watched button
                document.getElementById('watched-btn').addEventListener('click', () => {
                    this.markAsWatched();
                });

                // Review button
                document.getElementById('review-btn').addEventListener('click', () => {
                    this.showReviewForm();
                });

                // Star rating
                this.setupStarRating();
            }

            setupStarRating() {
                const stars = document.querySelectorAll('#review-stars .star');
                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        this.userRating = parseInt(star.dataset.value);
                        this.renderStars();
                    });
                });
            }

            renderStars() {
                const stars = document.querySelectorAll('#review-stars .star');
                stars.forEach((star, index) => {
                    star.classList.toggle('active', index < this.userRating);
                });
            }

            showReviewForm() {
                const auth = window.Auth?.getAuth?.();
                if (!auth?.token) {
                    alert('Please sign in to write a review.');
                    window.location.href = 'login.html';
                    return;
                }

                document.getElementById('review-form').style.display = 'block';
                document.getElementById('review-btn').style.display = 'none';

                // Setup review submission
                document.getElementById('submit-review').onclick = () => this.submitReview();
                document.getElementById('cancel-review').onclick = () => {
                    document.getElementById('review-form').style.display = 'none';
                    document.getElementById('review-btn').style.display = 'block';
                };
            }

            async submitReview() {
                if (this.userRating === 0) {
                    alert('Please select a rating');
                    return;
                }

                const reviewText = document.getElementById('review-text').value.trim();
                if (!reviewText) {
                    alert('Please enter your review');
                    return;
                }

                try {
                    const auth = window.Auth.getAuth();
                    const response = await fetch(window.reviewsApiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + auth.token
                        },
                        body: JSON.stringify({
                            eventId: this.eventId,
                            rating: this.userRating,
                            text: reviewText,
                            sport: this.eventData.strSport,
                            eventName: this.eventData.strEvent
                        })
                    });

                    if (response.ok) {
                        alert('Review submitted successfully!');
                        location.reload();
                    } else {
                        throw new Error('Failed to submit review');
                    }
                } catch (error) {
                    alert('Error submitting review: ' + error.message);
                }
            }

            async addToWatchlist() {
                // Implement watchlist functionality
                const auth = window.Auth?.getAuth?.();
                if (!auth?.token) {
                    alert('Please sign in to add to watchlist');
                    window.location.href = 'login.html';
                    return;
                }

                alert('Added to watchlist!');
                // Implement actual API call here
            }

            async markAsWatched() {
                // Implement watched functionality
                const auth = window.Auth?.getAuth?.();
                if (!auth?.token) {
                    alert('Please sign in to mark as watched');
                    window.location.href = 'login.html';
                    return;
                }

                alert('Marked as watched!');
                // Implement actual API call here
            }

            hideLoading() {
                document.getElementById('event-loading').style.display = 'none';
                document.getElementById('event-content').style.display = 'block';
            }

            showError() {
                document.getElementById('event-loading').style.display = 'none';
                document.getElementById('event-error').style.display = 'block';
            }
        }

        // Initialize the event page when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new EventPage();
        });
    </script>
</body>
</html>
