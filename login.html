<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign In - SportsReplayed</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />

    <script src="js/config.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/auth.js"></script>

    <style>
      .login-form-container {
        max-width: 450px;
        margin: 50px auto;
        padding: 30px;
        background-color: var(--card-color);
        border-radius: 8px;
        border: 1px solid var(--border-color);
      }
      .login-form-container h1 {
        text-align: center;
        border-bottom: none;
        margin-bottom: 30px;
      }
      .form-group {
        margin-bottom: 20px;
      }
      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: var(--text-light);
      }
      .form-group input {
        width: 100%;
        padding: 12px;
        background-color: var(--bg-color);
        border: 1px solid var(--border-color);
        color: var(--text-light);
        border-radius: 5px;
        box-sizing: border-box; /* Important for correct padding calculation */
      }
      .form-group button {
        width: 100%;
        padding: 12px;
        background-color: var(--accent-color);
        color: var(--bg-color);
        border: none;
        border-radius: 5px;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }
      .form-footer {
        text-align: center;
        margin-top: 20px;
      }
      .form-error {
        display: none;
        color: #ff6b6b;
        font-size: 0.9rem;
        margin-top: 8px;
      }
      .form-group.invalid input {
        border-color: #ff6b6b;
      }
    </style>
      <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>

  <body>
    <div data-include="header"></div>

    <main>
      <div class="login-form-container">
        <form id="login-form" novalidate>
          <h1>Sign In</h1>
          <div class="form-group">
            <label for="username">Username or Email</label>
            <input type="text" id="username" name="username" required />
            <small class="form-error" id="username-error"></small>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
            <small class="form-error" id="password-error"></small>
          </div>
          <div class="form-group">
            <button type="submit" id="login-submit">Sign In</button>
          </div>
          <div class="form-footer">
            <p>Don't have an account? <a href="register.html">Create one</a></p>
            <p><a href="request-reset.html">Forgot your password?</a></p>
          </div>
        </form>
      </div>
    </main>

    <div data-include="footer"></div>

    <script>
      (function () {
        const form = document.getElementById("login-form");
        const usernameInput = document.getElementById("username");
        const passwordInput = document.getElementById("password");
        const submitBtn = document.getElementById("login-submit");
        const usernameError = document.getElementById("username-error");
        const passwordError = document.getElementById("password-error");

        function setError(groupEl, errorEl, message) {
          groupEl.classList.add("invalid");
          errorEl.textContent = message;
          errorEl.style.display = "block";
        }

        function clearError(groupEl, errorEl) {
          groupEl.classList.remove("invalid");
          errorEl.textContent = "";
          errorEl.style.display = "none";
        }

        function validate() {
          let valid = true;

          const usernameGroup = usernameInput.parentElement;
          const passwordGroup = passwordInput.parentElement;

          clearError(usernameGroup, usernameError);
          clearError(passwordGroup, passwordError);

          const username = usernameInput.value.trim();
          const password = passwordInput.value;

          if (!username) {
            setError(
              usernameGroup,
              usernameError,
              "Please enter your username or email."
            );
            valid = false;
          }

          if (!password) {
            setError(
              passwordGroup,
              passwordError,
              "Please enter your password."
            );
            valid = false;
          } else if (password.length < 6) {
            setError(
              passwordGroup,
              passwordError,
              "Password must be at least 6 characters."
            );
            valid = false;
          }

          return valid;
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          if (!validate()) return;

          submitBtn.disabled = true;
          const originalText = submitBtn.textContent;
          submitBtn.textContent = "Signing in…";

          const payload = {
            username: usernameInput.value.trim(),
            password: passwordInput.value,
          };

          try {
            const res = await fetch(window.loginApiUrl, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!res.ok) {
              // Prefer a JSON error message if provided, otherwise fallback to text/status
              let errMsg = "Invalid credentials";
              try {
                const contentType = res.headers.get("content-type") || "";
                if (contentType.includes("application/json")) {
                  const errJson = await res.json();
                  errMsg =
                    errJson.message || errJson.error || JSON.stringify(errJson);
                } else {
                  const errText = await res.text();
                  errMsg = errText || errMsg;
                }
              } catch (parseErr) {
                errMsg = res.statusText || errMsg;
              }
              throw new Error(errMsg);
            }

            const data = await res.json().catch(() => ({}));
            const token = data.token || data.accessToken || data.jwt;
            const user = data.user || { username: payload.username };
            if (
              token &&
              window.Auth &&
              typeof window.Auth.saveAuth === "function"
            ) {
              window.Auth.saveAuth(token, user);
            } else if (
              window.Auth &&
              typeof window.Auth.saveAuth === "function"
            ) {
              // If endpoint succeeded but didn't return a token, still save minimal auth
              window.Auth.saveAuth("token", user);
            }
            window.location.href = "profile.html";
          } catch (err) {
            const passwordGroup = passwordInput.parentElement;
            setError(
              passwordGroup,
              passwordError,
              (err && err.message) || "Sign-in failed. Please try again."
            );
          } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
          }
        });
      })();
    </script>
  </body>
</html>
