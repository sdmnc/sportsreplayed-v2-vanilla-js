<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - SportsReplayed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebPage",
      "name": "User Profile - SportsReplayed",
      "url": "https://sportsreplayed.com/profile.html",
      "description": "View and manage your SportsReplayed profile, track reviews, and analyze your sports replay activity.",
      "keywords": [
        "personal sports match history tracker",
        "log every sports match I watch",
        "create a list of watched football games",
        "online sports viewing diary",
        "personal match log for soccer fans"
      ]
    }
    </script>
    
    <script src="js/config.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/auth.js"></script>
    
    <style>
        :root {
            --profile-bg: #14181C;
            --profile-text: #9ab;
            --profile-text-light: #e1e7ee;
            --profile-border: #2c3440;
            --profile-avatar-bg: #2c3440;
            --profile-avatar-icon: #678;
        }

        .profile-container {
            max-width: 960px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .profile-header {
            display: flex;
            align-items: flex-end;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--profile-border);
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            background: var(--profile-avatar-bg);
            border-radius: 50%;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .profile-avatar i {
            font-size: 40px;
            color: var(--profile-avatar-icon);
        }
        
        .profile-info h1 {
            font-size: 2.5rem;
            color: var(--profile-text-light);
            margin: 0 0 5px 0;
            border: none;
        }
        .profile-info p {
            font-size: 1rem;
            color: var(--profile-text);
            margin: 0;
        }
        #edit-profile-btn {
            display: none;
            margin-left: 15px;
            background: var(--profile-border);
            color: var(--profile-text-light);
            font-size: 0.8rem;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-left: 110px;
        }
        .stat-item {
            color: var(--profile-text);
        }
        .stat-item strong {
            font-size: 1.2rem;
            color: var(--profile-text-light);
            margin-right: 5px;
        }

        .profile-nav {
            display: flex;
            gap: 20px;
            border-bottom: 1px solid var(--profile-border);
            margin-bottom: 30px;
        }
        .profile-nav a {
            color: var(--profile-text);
            text-decoration: none;
            padding: 10px 0;
            font-weight: 600;
            font-size: 0.9rem;
            border-bottom: 2px solid transparent;
        }
        .profile-nav a.active {
            color: var(--profile-text-light);
            border-bottom-color: var(--accent-color);
        }

        .profile-body {
            color: var(--profile-text);
        }
        .profile-body h2 {
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--profile-text-light);
            border-bottom: 1px solid var(--profile-border);
            padding-bottom: 5px;
        }
        
        #private-info {
            display: none;
            background: var(--profile-avatar-bg);
            border: 1px solid var(--profile-border);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        #private-info h3 { margin-top: 0; color: var(--profile-text-light); }
        
        #profile-message {
            text-align: center;
            font-size: 1.2rem;
            padding: 40px 0;
            color: var(--profile-text);
        }

        /* Inline review form styling reused from submitreview.html */
        .profile-review-form {
            max-width: 700px;
            margin: 30px auto 10px;
            background: var(--card-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }
        .profile-review-form h2 {
            border: none;
            margin-bottom: 10px;
            text-align: center;
        }
        .profile-review-form .form-row { margin-bottom: 16px; }
        .profile-review-form .form-row label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-weight: 600;
        }
        .profile-review-form .form-row select,
        .profile-review-form .form-row textarea {
            width: 100%;
            background: var(--bg-color);
            color: var(--text-light);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            box-sizing: border-box;
        }
        .profile-review-form .form-row textarea {
            min-height: 140px;
            resize: vertical;
        }
        .profile-review-form .stars {
            display: inline-flex;
            gap: 8px;
            font-size: 1.6rem;
            cursor: pointer;
        }
        .profile-review-form .star {
            color: #4b5663;
        }
        .profile-review-form .star.active,
        .profile-review-form .star.hover {
            color: var(--accent-color);
        }
        .profile-review-form .form-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 12px;
        }
        .profile-review-form .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .profile-review-form .btn.secondary {
            background: transparent;
            color: var(--text-light);
            border: 1px solid var(--border-color);
        }
        .profile-review-form .note {
            text-align: center;
            color: var(--text-color);
            font-size: 0.95rem;
            margin-top: 8px;
        }
    </style>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>

<body>
    <div data-include="header"></div>

    <main>
        <div class="profile-container" id="profile-container" style="display:none;">
            <div class="profile-header">
                <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                <div class="profile-info">
                    <h1 id="pf-username">username</h1>
                </div>
                <button id="edit-profile-btn">EDIT PROFILE</button>
            </div>

            <div class="profile-stats">
                <div class="stat-item"><strong id="pf-stat-reviews">0</strong><span>REVIEWS</span></div>
                <div class="stat-item"><strong id="pf-stat-following">0</strong><span>FOLLOWING</span></div>
                <div class="stat-item"><strong id="pf-stat-followers">0</strong><span>FOLLOWERS</span></div>
            </div>

            <div class="profile-nav">
                <a href="#" class="active">Profile</a>
                <a href="#">Activity</a>
                <a href="#">Reviews</a>
                <a href="#">Watchlist</a>
                <a href="#">Lists</a>
            </div>

            <div class="profile-body">
                <div class="profile-main">
                    <h2>Recent Activity</h2>
                    <p>No recent activity.</p>
                    
                    <div id="private-info">
                        <h3>Private Information</h3>
                        <p>Only visible to you.</p>
                        <strong>Email:</strong> <span id="pf-email"></span>
                    </div>
                </div>
            </div>

            <!-- Inline review form so users can submit directly from profile -->
            <section class="profile-review-form" id="profile-review-form">
                <h2>Submit a Review</h2>
                <div class="form-row">
                    <label for="pf-sport">Sport</label>
                    <select id="pf-sport">
                        <option value="" selected disabled>Select a sport</option>
                        <option>Soccer</option>
                        <option>Basketball</option>
                        <option>American Football</option>
                        <option>Baseball</option>
                        <option>Tennis</option>
                        <option>Athletics</option>
                        <option>Formula 1</option>
                        <option>UFC / MMA</option>
                        <option>Hockey</option>
                        <option>Golf</option>
                        <option>Cycling</option>
                        <option>Cricket</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>Rating</label>
                    <div class="stars" id="pf-stars" aria-label="Star rating" role="radiogroup">
                        <i class="fa-solid fa-star star" data-value="1" role="radio" aria-checked="false" tabindex="0"></i>
                        <i class="fa-solid fa-star star" data-value="2" role="radio" aria-checked="false" tabindex="0"></i>
                        <i class="fa-solid fa-star star" data-value="3" role="radio" aria-checked="false" tabindex="0"></i>
                        <i class="fa-solid fa-star star" data-value="4" role="radio" aria-checked="false" tabindex="0"></i>
                        <i class="fa-solid fa-star star" data-value="5" role="radio" aria-checked="false" tabindex="0"></i>
                    </div>
                </div>
                <div class="form-row">
                    <label for="pf-review">Your Review</label>
                    <textarea id="pf-review" placeholder="Share your thoughts..."></textarea>
                </div>
                <div class="form-actions">
                    <button class="btn" id="pf-submit-btn" type="button">Submit Review</button>
                    <button class="btn secondary" id="pf-clear-btn" type="button">Clear</button>
                </div>
                <div class="note">
                    Reviews are saved to your account and can be discovered by other fans.
                </div>
            </section>
        </div>

        <div id="profile-message">Loading profile...</div>
    </main>

    
    <div data-include="footer"></div>

    <script>
        (async function() {
            const container = document.getElementById('profile-container');
            const messageEl = document.getElementById('profile-message');
            const usernameEl = document.getElementById('pf-username');
            const emailEl = document.getElementById('pf-email');
            const editBtn = document.getElementById('edit-profile-btn');
            const privateInfoEl = document.getElementById('private-info');

            // Get auth info
            const auth = (window.Auth && window.Auth.getAuth && window.Auth.getAuth()) || { token: null, user: null };

            // Determine profile type and construct API URL
            const path = window.location.pathname;
            const pathSegments = path.split('/').filter(Boolean);
            const params = new URLSearchParams(window.location.search);
            const usernameParam = params.get('username');
            
            let isOwnProfile = false;
            let username = null;
            let apiUrl = '';
            
            if (usernameParam) {
                // Viewing someone else's profile via query string
                username = usernameParam;
                isOwnProfile = (auth.user && auth.user.username === username);
                apiUrl = window.apiUrl(`/api/profile/${encodeURIComponent(username)}`);
            } else if (pathSegments.length > 0 && pathSegments[0] !== 'profile.html') {
                // Viewing someone else's profile: /username (legacy support)
                username = pathSegments[0];
                isOwnProfile = (auth.user && auth.user.username === username);
                apiUrl = window.apiUrl(`/api/profile/${encodeURIComponent(username)}`);
            } else {
                // Viewing own profile: /profile.html
                isOwnProfile = true;
                apiUrl = window.apiUrl('/api/me');
                if (!auth.token) {
                    window.location.href = 'login.html';
                    return;
                }
            }

            // Load profile data
            try {
                const headers = {};
                if (isOwnProfile && auth.token) {
                    headers['Authorization'] = 'Bearer ' + auth.token;
                }
                
                const res = await fetch(apiUrl, { headers });

                if (!res.ok) {
                    if (res.status === 404) {
                        throw new Error(`User "${username}" not found.`);
                    } else {
                        throw new Error('Failed to load profile.');
                    }
                }
                
                const data = await res.json();
                const user = data.user;
                
                if (!user) throw new Error('Invalid user data returned.');

                usernameEl.textContent = user.username;
                document.title = `${user.username}'s Profile - SportsReplayed`;

                if (isOwnProfile) {
                    emailEl.textContent = user.email || '(not set)';
                    privateInfoEl.style.display = 'block';
                    editBtn.style.display = 'inline-block';
                }

                container.style.display = 'block';
                messageEl.style.display = 'none';

            } catch (err) {
                console.error('Profile loading error:', err);
                messageEl.textContent = err.message || 'Unable to load profile.';
                messageEl.style.color = '#ff6b6b';
            }
        })();

        // Lightweight reuse of submitreview.html functionality for profile page
        (function () {
            const starsEl = document.getElementById('pf-stars');
            if (!starsEl) return; // Safety

            const starEls = Array.from(starsEl.querySelectorAll('.star'));
            const submitBtn = document.getElementById('pf-submit-btn');
            const clearBtn = document.getElementById('pf-clear-btn');
            const sportEl = document.getElementById('pf-sport');
            const reviewEl = document.getElementById('pf-review');
            let rating = 0;

            function render(r) {
                starEls.forEach((s, idx) => {
                    const val = idx + 1;
                    s.classList.toggle('active', val <= r);
                    s.setAttribute('aria-checked', String(val === r));
                });
            }
            function handleHover(val) {
                starEls.forEach((s, idx) => s.classList.toggle('hover', idx < val));
            }

            starEls.forEach((s) => {
                s.addEventListener('mouseenter', () => handleHover(Number(s.dataset.value)));
                s.addEventListener('mouseleave', () => handleHover(0));
                s.addEventListener('click', () => { rating = Number(s.dataset.value); render(rating); });
                s.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        rating = Number(s.dataset.value);
                        render(rating);
                    }
                });
            });

            clearBtn.addEventListener('click', () => {
                rating = 0;
                render(rating);
                sportEl.selectedIndex = 0;
                reviewEl.value = '';
            });

            submitBtn.addEventListener('click', async () => {
                const sport = sportEl.value;
                const text = reviewEl.value.trim();

                if (!sport) { alert('Please select a sport.'); return; }
                if (!rating) { alert('Please choose a rating.'); return; }
                if (!text) { alert('Please enter your review.'); return; }

                const auth = window.Auth && window.Auth.getAuth ? window.Auth.getAuth() : { token: null };
                if (!auth.token) {
                    alert('Please sign in to submit your review.');
                    window.location.href = 'login.html';
                    return;
                }

                try {
                    const res = await fetch(window.reviewsApiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + auth.token
                        },
                        body: JSON.stringify({ sport, rating, text })
                    });

                    if (!res.ok) {
                        const t = await res.text();
                        throw new Error(t || 'Failed to submit review');
                    }

                    const data = await res.json();
                    alert('Review submitted! ID: ' + data.id);
                    rating = 0;
                    render(rating);
                    sportEl.selectedIndex = 0;
                    reviewEl.value = '';
                } catch (err) {
                    alert((err && err.message) || 'Unable to submit review.');
                }
            });
        })();
    </script>
</body>
</html>
