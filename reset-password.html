<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Reset Password - SportsReplayed</title> 
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="js/partials.js"></script>
    <script src="js/auth.js"></script>
    <style>
        .form-error { display: none; color: #ff6b6b; font-size: 0.9rem; margin-top: 8px; }
        .form-group.invalid input { border-color: #ff6b6b; }
        .success { color: #9fda9f; margin-top: 10px; }
    </style>
 <script src="js/config.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
</head>

<body>

    <div data-include="header"></div>

    <main>
        <div class="login-form-container">
            <form id="reset-form" novalidate>
                <h1>Reset Password</h1>
                <div class="form-group">
                    <label for="new-password">New Password</label>
                    <input type="password" id="new-password" required>
                    <small class="form-error" id="password-error"></small>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required>
                    <small class="form-error" id="confirm-error"></small>
                </div>
                <div class="form-group">
                    <button type="submit" id="reset-submit">Update Password</button>
                </div>
                <div class="form-footer">
                    <p><a href="login.html">Back to Sign In</a></p>
                    <div id="success-msg" class="success" style="display:none;">Password updated. Redirecting…</div>
                </div>
            </form>
        </div>
    </main>

    <div data-include="footer"></div>

    <script>
        (function() {
            const url = new URL(window.location.href);
            const token = url.searchParams.get('token');
            const form = document.getElementById('reset-form');
            const passInput = document.getElementById('new-password');
            const confirmInput = document.getElementById('confirm-password');
            const passErr = document.getElementById('password-error');
            const confirmErr = document.getElementById('confirm-error');
            const submitBtn = document.getElementById('reset-submit');
            const successMsg = document.getElementById('success-msg');

            if (!token) {
                alert('Missing token. Please use the link from your email.');
            }

            function setError(groupEl, errorEl, message) {
                groupEl.classList.add('invalid');
                errorEl.textContent = message;
                errorEl.style.display = 'block';
            }
            function clearError(groupEl, errorEl) {
                groupEl.classList.remove('invalid');
                errorEl.textContent = '';
                errorEl.style.display = 'none';
            }

            function validate() {
                let valid = true;
                const g1 = passInput.parentElement;
                const g2 = confirmInput.parentElement;
                clearError(g1, passErr);
                clearError(g2, confirmErr);
                const p1 = passInput.value;
                const p2 = confirmInput.value;
                if (!p1 || p1.length < 6) { setError(g1, passErr, 'Password must be at least 6 characters.'); valid = false; }
                if (!p2 || p2 !== p1) { setError(g2, confirmErr, 'Passwords do not match.'); valid = false; }
                return valid;
            }

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                if (!validate()) return;
                submitBtn.disabled = true;
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Updating…';
                try {
                    const res = await fetch(window.resetPasswordApiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password: passInput.value })
                    });
                    if (!res.ok) {
                        const t = await res.text();
                        throw new Error(t || 'Failed to reset password');
                    }
                    successMsg.style.display = 'block';
                    setTimeout(() => { window.location.href = 'login.html'; }, 1200);
                } catch (err) {
                    setError(confirmInput.parentElement, confirmErr, (err && err.message) || 'Unable to reset password.');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalText;
                }
            });
        })();
    </script>

</body>
</html>
